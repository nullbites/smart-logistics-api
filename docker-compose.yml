services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - '5432:5432'
    volumes:
      - 'logistics_pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logistics -d logistics']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Application container. Not runnable until the Dockerfile is added in the hardening slice.
  app:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: 'postgresql://logistics:logistics@db:5432/logistics?schema=public'
      PORT: '3000'
      HOST: '0.0.0.0'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    command: ['node', 'dist/cli/index.js', 'serve']

volumes:
  logistics_pgdata: {}
